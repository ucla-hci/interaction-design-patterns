  <rect x="397" y="294" width="521" height="146" class="some" />
  <text x="407" y="312" class="id">#sources</text><text x="470" y="312">▾ sources</text>
  <rect x="540" y="299" width="70" height="18" class="some" /><text x="550" y="312">n used</text>
  <rect x="616" y="299" width="94" height="18" class="some" /><text x="624" y="312">m retrieved</text>
  <text x="720" y="312" class="lab">a count (2 of 5)</text>
  <rect x="407" y="324" width="501" height="50" class="all" />
  <line x1="417" y1="340" x2="700" y2="340" class="line" />
  <text x="417" y="364" class="lab">year · kind</text>
  <rect x="520" y="352" width="160" height="16" class="some" /><text x="526" y="364">how it was found</text>
  <rect x="820" y="333" width="76" height="22" class="all" /><text x="830" y="348" class="id">#open</text>
  <rect x="407" y="380" width="501" height="50" class="all" />
  <line x1="417" y1="396" x2="660" y2="396" class="line" />
  <text x="417" y="420" class="lab">year · kind</text>
  <rect x="820" y="389" width="76" height="22" class="all" /><text x="830" y="404" class="id">#open</text>
