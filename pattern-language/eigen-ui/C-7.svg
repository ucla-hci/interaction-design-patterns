  <rect x="230" y="200" width="120" height="54" class="all" /><line x1="242" y1="230" x2="330" y2="230" class="line" />

  <rect x="40" y="380" width="140" height="54" class="all" /><line x1="52" y1="410" x2="160" y2="410" class="line" />
  <rect x="230" y="380" width="120" height="54" class="all" /><line x1="242" y1="410" x2="330" y2="410" class="line" />
  <path d="M180 407 L230 407" stroke="#000" stroke-width="3.5" fill="none" />
  <text x="40" y="456" class="lab">or a link: the evidence for the relation (1 of 5)</text>
  <line x1="190" y1="248" x2="385" y2="248" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- attached evidence -->
  <rect x="385" y="10" width="545" height="540" class="all" />
  <text x="397" y="30" class="id">#evidence</text>
  <text x="466" y="30" class="lab">stored on the item; opens from it, beside the item (C-6)</text>

  <text x="397" y="58" class="id">#for</text>
  <line x1="436" y1="54" x2="600" y2="54" class="line" />
  <text x="616" y="58" class="lab">names the item it justifies (5 of 5)</text>

  <rect x="397" y="72" width="521" height="96" class="all" />
  <text x="407" y="90" class="id">#rationale</text><text x="476" y="90">▾ why the item holds</text>
