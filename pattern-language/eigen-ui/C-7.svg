  <rect x="40" y="70" width="140" height="54" class="all" /><line x1="52" y1="100" x2="160" y2="100" class="line" />
  <path d="M110 124 L110 200" class="edge" />
  <path d="M110 124 C110 160, 290 160, 290 200" class="edge" />
  <rect x="40" y="200" width="150" height="96" class="sel" />
  <text x="52" y="222" class="id">#item</text><text x="96" y="222">selected</text>
  <line x1="52" y1="246" x2="176" y2="246" class="line" />
  <line x1="52" y1="262" x2="150" y2="262" class="line" />
  <rect x="152" y="254" width="14" height="16" class="some" />
