  <rect x="397" y="466" width="521" height="62" class="some" />
  <text x="407" y="484">▸ evidence that is not a source: a table of members, a simulation</text>
  <rect x="407" y="494" width="120" height="26" class="all" /><rect x="537" y="494" width="120" height="26" class="all" />
  <text x="397" y="544" class="lab">data as evidence (2 of 5) · sections collapse (3 of 5)</text>
</svg>
