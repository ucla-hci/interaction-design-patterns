  <line x1="407" y1="126" x2="900" y2="126" class="line" />
  <line x1="407" y1="142" x2="760" y2="142" class="line" />
  <text x="397" y="184" class="lab">the rationale in prose (4 of 5)</text>

  <rect x="397" y="194" width="521" height="74" class="some" />
  <text x="407" y="214">field 1</text><line x1="500" y1="210" x2="900" y2="210" class="line" />
  <text x="407" y="236">field 2</text><line x1="500" y1="232" x2="860" y2="232" class="line" />
  <text x="407" y="258">field 3</text><line x1="500" y1="254" x2="880" y2="254" class="line" />
