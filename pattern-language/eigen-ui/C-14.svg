<svg viewBox="0 0 940 560" role="img" aria-label="Wireframe of new items linked to the items that produced them, with the replaced item kept">
  <!-- map: origin, replaced item, new item -->
  <rect x="10" y="10" width="480" height="540" class="all" />
  <text x="22" y="30" class="lab">each new or revised item links to what produced it (4 of 4)</text>

  <rect x="150" y="56" width="180" height="70" class="all" />
  <text x="162" y="76">item · replaced</text>
  <line x1="162" y1="96" x2="310" y2="96" class="line" />
  <rect x="162" y="104" width="110" height="16" class="some" /><text x="168" y="116">not approved</text>
  <text x="340" y="80" class="lab">the replaced item</text>
  <text x="340" y="96" class="lab">stays (3 of 4)</text>
  <text x="340" y="112" class="lab">· a status (1 of 4)</text>

  <path d="M240 126 L240 186" class="edge" />
  <rect x="150" y="186" width="180" height="60" class="all" />
  <text x="162" y="206">what was done</text>
  <line x1="162" y1="226" x2="300" y2="226" class="line" />
  <text x="340" y="212" class="lab">a result, an edit,</text>
  <text x="340" y="228" class="lab">a discussion</text>

  <path d="M240 246 C240 290, 110 290, 110 330" class="edge" stroke-dasharray="6 4" />
  <path d="M240 246 C240 290, 370 290, 370 330" class="edge" stroke-dasharray="6 4" />
  <text x="385" y="266" class="id">#from</text>
  <text x="385" y="282" class="lab">dashed, apart from</text>
  <text x="385" y="298" class="lab">other links (2 of 4)</text>

  <rect x="30" y="330" width="170" height="86" class="sel" />
  <text x="42" y="350" class="id">#new</text><text x="84" y="350">item</text>
  <line x1="42" y1="372" x2="184" y2="372" class="line" />
  <rect x="42" y="386" width="120" height="18" class="some" /><text x="48" y="399">n sources</text>
  <rect x="290" y="330" width="170" height="86" class="all" />
  <text x="302" y="350" class="id">#new</text><text x="344" y="350">item</text>
  <line x1="302" y1="372" x2="444" y2="372" class="line" />
  <text x="125" y="434" class="lab">the new item counts its sources (1 of 4)</text>

  <path d="M115 416 L115 470" class="edge" />
  <rect x="30" y="470" width="170" height="54" class="some" /><line x1="42" y1="500" x2="184" y2="500" class="line" />
  <text x="210" y="494" class="lab">the new item is the start</text>
  <text x="210" y="510" class="lab">of the next round (2 of 4)</text>

  <!-- revision card -->
  <rect x="505" y="10" width="425" height="290" class="some" />
  <text x="517" y="30" class="id">#revision</text>
  <text x="586" y="30" class="lab">a revised item keeps what it replaced (1 of 4)</text>
  <text x="517" y="58">item</text>
  <rect x="560" y="44" width="44" height="20" class="some" /><text x="568" y="58">v2</text>
  <text x="614" y="58" class="lab">a version (1 of 4)</text>
  <text x="517" y="88">field 1</text>
  <rect x="517" y="96" width="196" height="76" class="all" /><text x="527" y="114">before</text>
  <line x1="527" y1="134" x2="700" y2="134" class="line" /><line x1="527" y1="150" x2="660" y2="150" class="line" />
  <rect x="722" y="96" width="196" height="76" class="all" /><text x="732" y="114">now</text>
  <line x1="732" y1="134" x2="905" y2="134" class="line" /><line x1="732" y1="150" x2="880" y2="150" class="line" />
  <text x="517" y="196">field 2</text>
  <rect x="517" y="204" width="196" height="56" class="all" /><text x="527" y="222">before</text>
  <line x1="527" y1="242" x2="680" y2="242" class="line" />
  <rect x="722" y="204" width="196" height="56" class="all" /><text x="732" y="222">now</text>
  <line x1="732" y1="242" x2="890" y2="242" class="line" />
  <text x="517" y="284" class="lab">before and now, side by side, by field; only the fields that changed</text>

  <!-- composition highlights its sources -->
  <rect x="505" y="316" width="425" height="234" class="some" />
  <text x="517" y="336" class="lab">a composed item marks the items that it uses (1 of 4)</text>
  <rect x="517" y="350" width="80" height="34" class="sel" /><rect x="517" y="400" width="80" height="34" class="sel" />
  <rect x="517" y="450" width="80" height="34" class="all" />
  <path d="M557 384 L557 400" stroke="#000" stroke-width="3.5" fill="none" />
  <path d="M557 434 L557 450" class="edge" />
  <rect x="640" y="350" width="278" height="134" class="all" />
  <text x="652" y="370">composition</text>
  <line x1="652" y1="392" x2="900" y2="392" class="line" />
  <line x1="652" y1="408" x2="880" y2="408" class="line" />
  <line x1="652" y1="438" x2="900" y2="438" class="line" />
  <line x1="652" y1="454" x2="820" y2="454" class="line" />
  <path d="M597 367 L640 380 M597 417 L640 430" class="edge" stroke-dasharray="6 4" />
  <text x="517" y="508" class="lab">when the composition is in focus,</text>
  <text x="517" y="524" class="lab">the items and the links that it uses are marked</text>
</svg>
