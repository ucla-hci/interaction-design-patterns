<svg viewBox="0 0 940 560" role="img" aria-label="Wireframe of an overview with a detail panel open beside it">
  <!-- overview -->
  <rect x="10" y="10" width="520" height="540" class="all" />
  <text x="22" y="30" class="id">#overview</text>
  <text x="90" y="30" class="lab">stays visible while the detail is open (3 of 3); a map, C-4 (2 of 3), or a list (1 of 3)</text>
  <rect x="40" y="70" width="140" height="54" class="all" /><line x1="52" y1="100" x2="160" y2="100" class="line" />
  <rect x="320" y="70" width="140" height="54" class="all" /><line x1="332" y1="100" x2="440" y2="100" class="line" />
  <rect x="180" y="220" width="160" height="64" class="sel" />
  <text x="192" y="242" class="id">#item</text><text x="236" y="242">selected</text>
  <line x1="192" y1="266" x2="320" y2="266" class="line" />
  <text x="180" y="304" class="lab">the selected item is marked in the overview (2 of 3)</text>
  <rect x="40" y="380" width="140" height="54" class="all" /><line x1="52" y1="410" x2="160" y2="410" class="line" />
  <rect x="320" y="380" width="140" height="54" class="all" /><line x1="332" y1="410" x2="440" y2="410" class="line" />
  <line x1="340" y1="252" x2="545" y2="252" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- detail panel -->
  <rect x="545" y="10" width="385" height="540" class="all" />
  <text x="557" y="30" class="id">#detail</text>
  <text x="610" y="30" class="lab">a side panel beside the overview (3 of 3)</text>

  <text x="557" y="58" class="id">#title</text>
  <line x1="610" y1="54" x2="740" y2="54" class="line" />
  <rect x="770" y="42" width="82" height="22" class="some" /><text x="778" y="57">keep ◉</text>
  <rect x="862" y="42" width="56" height="22" class="some" /><text x="870" y="57">✕</text>
  <text x="557" y="80" class="lab">keep toggle, C-12 (1 of 3)   ·   close #close (1 of 3)</text>

  <rect x="557" y="90" width="361" height="24" class="some" />
  <text x="567" y="106">tab 1 │ tab 2 │ tab 3</text>
  <text x="557" y="128" class="lab">tabs (1 of 3)</text>

  <rect x="557" y="138" width="361" height="96" class="all" />
  <text x="567" y="156" class="id">#claim</text><text x="620" y="156">▾ explanation</text>
  <line x1="567" y1="176" x2="900" y2="176" class="line" />
  <line x1="567" y1="192" x2="900" y2="192" class="line" />
  <line x1="567" y1="208" x2="820" y2="208" class="line" />
  <text x="567" y="226" class="lab">why the item holds, in prose (3 of 3)</text>

  <rect x="557" y="244" width="361" height="30" class="some" />
  <text x="567" y="264" class="id">#confidence</text><line x1="660" y1="260" x2="780" y2="260" class="line" />
  <text x="557" y="288" class="lab">confidence, a number or a sentence (2 of 3)</text>

  <rect x="557" y="298" width="361" height="96" class="some" />
  <text x="567" y="316" class="id">#source</text><text x="624" y="316">▾ sources</text><text x="720" y="316" class="lab">sections collapse (2 of 3)</text>
  <rect x="567" y="326" width="341" height="26" class="all" /><line x1="577" y1="339" x2="760" y2="339" class="line" /><text x="820" y="344" class="id">#opensrc</text>
  <rect x="567" y="358" width="341" height="26" class="all" /><line x1="577" y1="371" x2="740" y2="371" class="line" /><text x="820" y="376" class="id">#opensrc</text>
  <text x="557" y="408" class="lab">a list of sources, each one opens (2 of 3)</text>

  <rect x="557" y="418" width="361" height="80" class="some" />
  <text x="567" y="436">▸ other evidence: a table or a visualization</text>
  <rect x="567" y="446" width="100" height="42" class="all" /><rect x="677" y="446" width="100" height="42" class="all" />
  <text x="557" y="512" class="lab">evidence that is not a source (2 of 3)</text>

  <rect x="557" y="520" width="150" height="24" class="some" /><text x="567" y="536" class="id">#act</text><text x="600" y="536">action</text>
  <text x="716" y="536" class="lab">an action on the item (1 of 3)</text>
</svg>
