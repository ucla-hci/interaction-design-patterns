# Where each component pattern (CP) appears in the figures of the exemplar papers.
#
# figure: an id in data/figures/index.yaml (made by tools/extract_figures.py).
# box: [x0, y0, x1, y1], each a fraction of the figure width or height, so the box holds at any
#   resolution. The figures stay local in data/. This file holds no content of a paper.
# callout: the label of the region in the figure, when the paper gives one.
# state: the CP state that the crop shows, when the spec names states.
# Crop the instances: python3 tools/crop_cp.py
#
# Pilot, 9/29: CP-4 and CP-6. Instances follow the Examples column of pattern-language-mvp.md.

CP-4:
  name: Persistent Structure Map
  instances:
    - paper: halo
      figure: halo/fig-2
      callout: A
      box: [0.29, 0.06, 0.96, 0.50]
      shows: trajectory map; the cluster table (B) lies over its upper right
    - paper: happier
      figure: happier/fig-3
      callout: a1
      box: [0.33, 0.04, 0.79, 0.42]
      shows: interaction graph of one subgraph
    - paper: perspectevolver
      figure: perspectevolver/fig-4
      box: [0.47, 0.01, 0.99, 0.99]
      shows: canvas with the research question and its threads
    - paper: theseus
      figure: theseus/fig-2
      callout: A, B, D, E
      box: [0.00, 0.02, 0.79, 0.98]
      shows: hypothesis graph with experiment families and edge confidence
    - paper: ideasynth
      figure: ideasynth/fig-4
      callout: 1-5
      box: [0.26, 0.01, 0.99, 0.99]
      shows: canvas of typed facet nodes in a tree, linked to their origin

CP-6:
  name: Detail on Demand
  instances:
    - paper: halo
      figure: halo/fig-2
      callout: C
      box: [0.01, 0.06, 0.30, 0.49]
      state: open
      shows: cluster panel beside the map, strategies tab
    - paper: halo
      figure: halo/fig-10
      box: [0.09, 0.02, 0.95, 0.96]
      state: open
      shows: the same panel, overview and candidates tabs
    - paper: happier
      figure: happier/fig-3
      callout: b
      box: [0.03, 0.49, 0.97, 0.97]
      state: open
      shows: selected path in the graph, detail panel beside it
    - paper: theseus
      figure: theseus/fig-2
      callout: B, C
      box: [0.51, 0.03, 0.99, 0.96]
      state: open
      shows: selected sub-hypothesis, and its rationale and evidence panel
    - paper: ideasynth
      figure: ideasynth/fig-5
      callout: 6
      box: [0.01, 0.14, 0.82, 0.80]
      state: open
      shows: node with its left menu open, relevant paper sections and suggestions

# 10/22: CP-7, CP-10, CP-14. HAPPIER boxes are on the published PDF; the CP-4 and CP-6 boxes are
# on the anonymous submission. The two Fig. 3 differ by a few pixels.

CP-7:
  name: Attached Evidence
  instances:
    - paper: halo
      figure: halo/fig-10
      box: [0.09, 0.02, 0.50, 0.96]
      shows: cluster overview tab; summary, strengths, weaknesses, and the member table
    - paper: happier
      figure: happier/fig-3
      callout: b1
      box: [0.03, 0.53, 0.33, 0.76]
      shows: AI explanation of the selected path, and its references
    - paper: perspectevolver
      figure: perspectevolver/fig-2
      callout: 3
      box: [0.60, 0.20, 0.97, 0.74]
      shows: perspective card; a source count, and the fields that the sources support
    - paper: theseus
      figure: theseus/fig-2
      callout: C
      box: [0.79, 0.06, 0.99, 0.96]
      shows: decomposition rationale, papers used, each paper opens
    - paper: ideasynth
      figure: ideasynth/fig-5
      callout: 6
      box: [0.02, 0.22, 0.43, 0.64]
      shows: the paper sections most related to the selected node, and suggestions

CP-10:
  name: Proposal Set
  instances:
    - paper: halo
      figure: halo/fig-2
      callout: C
      box: [0.01, 0.19, 0.30, 0.49]
      shows: strategy list, intra- and inter-cluster; each strategy has a rationale and an edit action
    - paper: perspectevolver
      figure: perspectevolver/fig-1
      callout: 3
      box: [0.69, 0.61, 0.96, 0.97]
      shows: suggested threads; one is added, two stay unopened
    - paper: theseus
      figure: theseus/fig-3
      callout: I
      box: [0.58, 0.48, 0.97, 0.95]
      shows: follow-up paths to choose, and a group of three candidate hypotheses
    - paper: ideasynth
      figure: ideasynth/fig-4
      callout: 3
      box: [0.26, 0.34, 0.98, 0.57]
      shows: three generated design nodes side by side under one question

CP-14:
  name: Provenance Link
  instances:
    - paper: halo
      figure: halo/fig-2
      callout: A
      box: [0.29, 0.06, 0.75, 0.50]
      shows: trajectory map; each new candidate hangs from its source by a dashed edge
    - paper: perspectevolver
      figure: perspectevolver/fig-3
      callout: 3
      box: [0.65, 0.04, 0.98, 0.90]
      shows: revision card, Before and Now per field
    - paper: theseus
      figure: theseus/fig-3
      callout: H, I
      box: [0.70, 0.02, 0.97, 0.66]
      shows: a not-approved hypothesis, its experiment, and the follow-up paths that cite their source experiments
    - paper: ideasynth
      figure: ideasynth/fig-6
      box: [0.03, 0.08, 0.99, 0.92]
      shows: research brief beside the canvas; the nodes it uses are highlighted
